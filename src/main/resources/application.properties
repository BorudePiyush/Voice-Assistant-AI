spring.application.name=Voice Assist AI
spring.application.description=An intelligent voice assistant application powered by Java and Spring Boot

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.voiceassist.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# WebSocket Configuration
spring.websocket.servlet.path=/ws

# Weather Integration
voiceassist.weather.default-location=London

# External AI Chat API
# Gemini provider for open-ended answers.
voiceassist.ai.provider=gemini
voiceassist.ai.gemini.api-key=
voiceassist.ai.gemini.model=gemini-1.5-flash
voiceassist.ai.system-prompt=You are Voice Assist AI, a concise and helpful voice assistant. Answer clearly and directly.

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
